name: SonarCloud Analysis

# Esegue l'analisi di qualità del codice ad ogni push sul branch di default e su ogni Pull
# Request verso di esso, come descritto nella documentazione tecnica del progetto (sezione 7).
on:
  push:
    branches:
      - feature/scaffold-uniride-project-9856462800442749146
  pull_request:
    branches:
      - feature/scaffold-uniride-project-9856462800442749146

jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repository
        uses: actions/checkout@v4
        with:
          # SonarCloud calcola l'analisi Nuovo Codice confrontando con la cronologia completa.
          fetch-depth: 0

      - name: Imposta JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Cache dei pacchetti SonarCloud
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache delle dipendenze Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build, test e coverage (JaCoCo)
        run: mvn -B verify

      - name: Analisi SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B sonar:sonar
